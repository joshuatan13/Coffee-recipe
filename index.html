<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b2417" />
  <meta name="description" content="Track your favorite coffee beans and dial in espresso & pour over recipes." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Brew Log" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Brew Log — Coffee &amp; Recipe Tracker</title>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn back-btn" id="backBtn" aria-label="Back" hidden>‹</button>
    <h1 class="app-title" id="appTitle">Brew Log</h1>
    <button class="icon-btn" id="searchToggle" aria-label="Search">⌕</button>
  </header>

  <div class="search-bar" id="searchBar" hidden>
    <input type="search" id="searchInput" placeholder="Search…" autocomplete="off" />
  </div>

  <main id="view" class="view"></main>

  <button class="fab" id="fab" aria-label="Add">+</button>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="beans">
      <span class="tab-icon">🫘</span><span class="tab-label">Beans</span>
    </button>
    <button class="tab" data-tab="espresso">
      <span class="tab-icon">☕</span><span class="tab-label">Espresso</span>
    </button>
    <button class="tab" data-tab="pourover">
      <span class="tab-icon">🫗</span><span class="tab-label">Pour Over</span>
    </button>
    <button class="tab" data-tab="gear">
      <span class="tab-icon">⚙︎</span><span class="tab-label">Gear</span>
    </button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
